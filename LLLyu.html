<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 在 <head> 中引入 -->
    <title>华晨宇 · 火星世界</title>
    <style>
        /* 全局样式 - 星空暗黑风 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #0a0a0f;
            background-image: radial-gradient(ellipse at 20% 50%, #1a1a2e 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 20%, #16213e 0%, transparent 50%),
                              linear-gradient(180deg, #0a0a0f 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        /* 主卡片 - 毛玻璃效果 */
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 30px 30px 45px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            text-align: center;
        }

        /* 标题区域 */
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(241, 39, 17, 0.3);
            margin-bottom: 6px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        /* 图片容器 - 圆角 + 发光边框 */
        .image-wrapper {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(241, 39, 17, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            height: 350px; /* 固定高度，保持16:9比例 */
        }

        .image-wrapper:hover {
            transform: scale(1.01);
            box-shadow: 0 0 50px rgba(241, 39, 17, 0.25);
        }

        .image-wrapper img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #1a1a2e; /* 图片加载前的占位背景 */
        }

        /* 图片上的文字遮罩 */
        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 25px 25px;
            background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            text-align: left;
        }

        .image-overlay .tag {
            display: inline-block;
            background: rgba(241, 39, 17, 0.8);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            backdrop-filter: blur(4px);
        }

        .image-overlay h2 {
            font-size: 1.8rem;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* 音乐播放器卡片 */
        .music-player {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 20px 20px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 8px;
        }

        .music-player .song-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .music-player .song-info .name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
        }

        .music-player .song-info .artist {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
        }

        /* 自定义音频控件 - 更现代一点 */
        audio {
            width: 100%;
            height: 40px;
            border-radius: 30px;
            outline: none;
            background: rgba(255, 255, 255, 0.05);
            filter: invert(0.9) hue-rotate(180deg) saturate(0.6); /* 让原生控件变亮色 */
        }

        /* 提示文本 */
        .footer-note {
            margin-top: 20px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 20px 16px 30px;
                border-radius: 28px;
            }
            .header h1 {
                font-size: 2.2rem;
            }
            .image-overlay h2 {
                font-size: 1.3rem;
            }
            .image-overlay {
                padding: 25px 16px 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 标题 -->
    <div class="header">
        <h1>华晨宇</h1>
        <p>· 欢迎回家 ·</p>
    </div>
    <!-- 图片区域 -->
    <div class="image-wrapper">
        <img 
            src="https://cyu08042.github.io/yu/LLLyu向阳.webp" 
            alt="华晨宇 · 火星氛围感大片"
            loading="lazy"
            style="height: 350px; object-fit: cover;"
        >
    </div>
    <!-- 音乐播放器 -->
    <div class="music-player">
         <div class="image-overlay">
            <span class="tag">⚡ 火星 · 氛围感</span>
            <h5>「 在属于自己的星球，热烈绽放 」</h5>
        </div>
        <div class="song-info">
            <span class="name">🎵 向阳而生</span>
            <span class="artist">TO:LLL.yu</span>
        </div>
        <!-- 优化后推荐写法 -->
        <iframe 
            frameborder="no" 
            border="0" 
            marginwidth="0" 
            marginheight="0" 
            width="100%" 
            height="86" 
            src="https://music.163.com/outchain/player?type=2&id=2154764409&auto=0&height=66"
            allow="autoplay"
            loading="lazy">
        </iframe>

        <!-- <audio controls preload="metadata">
            <source src="https://music.163.com/outchain/player?type=2&id=2154764409&auto=1&height=66" type="audio/mpeg">
            您的浏览器不支持音频播放。
        </audio> -->
        <div style="margin-top: 8px; font-size: 0.7rem; color: rgba(255,255,255,0.2);">
        </div>
    </div>
    <div class="footer-note">
        ✦ 华晨宇 · 火星演唱会 ✦
    </div>
</div>
</body>
</html>
